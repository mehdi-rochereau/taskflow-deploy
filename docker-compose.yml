# ============================================================
# Docker Compose — TaskFlow production stack
# Services: taskflow-db, taskflow-api, taskflow-ui
# Registry: GitHub Container Registry (ghcr.io)
# ============================================================

services:

  # ── Database ───────────────────────────────────────────────
  taskflow-db:
    # MySQL 8.4 LTS. 8.0 reached end of support; 8.4 is the next LTS release and
    # the version already running in development, so both environments now match.
    # The data dictionary is migrated on first start and the migration is
    # irreversible: this volume will no longer start under 8.0. Rolling back
    # means restoring a dump into a fresh volume, or the Hetzner snapshot.
    # See issue #23 and docs/04-securite/DATABASE_RESTORE.md.
    image: mysql:8.4
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      # Passwords are supplied through *_FILE variants rather than inline values.
      # Docker records `environment` verbatim in Config.Env, where `docker inspect`
      # exposes it to anyone able to query the daemon, permanently and regardless
      # of file permissions. The _FILE form records only a path.
      #
      # Note these five variables are read by the MySQL image ONLY when the data
      # volume is first initialised. On an existing volume they are inert: changing
      # them here does nothing to the accounts stored in the mysql schema, which is
      # what DATABASE_CREDENTIAL_ROTATION.md is for. They matter for a rebuild from
      # scratch, which is why they stay.
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # The image defaults MYSQL_ROOT_HOST to '%', which creates root@'%' on top
      # of root@localhost. That account accepts TCP connections from any
      # container on taskflow-network, with full privileges. It was dropped by
      # hand on 15 August 2026 (#20), but nothing here reproduced that gesture:
      # a rebuild from an empty volume would silently bring it back, undoing the
      # hardening on the very path taken after a restore. Pinning the value to
      # localhost prevents the account from ever being created. See issue #29.
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - taskflow-db-data:/var/lib/mysql
      # Executed by the image only when taskflow-db-data is initialised from
      # scratch. Read-only: the container has no business writing here.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - taskflow-network
    healthcheck:
      # Liveness probe only. Runs as `healthcheck`@'%', an account holding USAGE
      # only: it can open a connection and reach no database, no table, no row.
      # No password on purpose. Passing one as an argument would leak it into the
      # container process table and into `docker inspect`, permanently, and a
      # drift between the account and its secret file would turn taskflow-db
      # unhealthy and block taskflow-api on its service_healthy condition.
      # The account is not cosmetic. mysqladmin exits 0 as soon as the server
      # answers, even on "access denied", so an anonymous probe would work just
      # as well, but since root@'%' was dropped (#20) the server treated every
      # probe as a login from a non-existent user, built a decoy account with a
      # randomly picked plugin and logged MY-013360 (sha256_password deprecated)
      # every 10 seconds, roughly 8600 lines a day, drowning real warnings.
      # See MySQL bug #109635. A named, existing account removes the cause.
      # -h 127.0.0.1 forces TCP, the same path the API uses. "localhost" would use
      # the Unix socket and test a path no client ever takes.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── API ────────────────────────────────────────────────────
  taskflow-api:
    image: ghcr.io/mehdi-rochereau/taskflow-api:latest
    container_name: taskflow-api
    restart: unless-stopped
    depends_on:
      taskflow-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: taskflow-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      # DB_USERNAME stays an ordinary variable on purpose: an account name is not
      # a credential, and the same value feeds MYSQL_USER on taskflow-db, so a
      # single source prevents the two services from drifting apart.
      # The two secrets that used to sit here, DB_PASSWORD and JWT_SECRET, are
      # now mounted as files, see the secrets block below. See issue #38.
      DB_USERNAME: ${DB_USERNAME}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      COOKIE_SECURE: ${COOKIE_SECURE}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    secrets:
      # Long form is mandatory here: the Compose secret name and the file name the
      # API expects do not coincide. The production profile imports the whole
      # directory with `spring.config.import: configtree:/run/secrets/`, which turns
      # each file name into a property name, so `target` IS the property, dot
      # included, and a typo produces a container that refuses to start.
      #
      # mysql_password is the same secret already mounted on taskflow-db, under a
      # different target. It is the password of the `taskflow` account: MySQL uses
      # it to create the account, the API uses it to connect. Duplicating it into a
      # second file would guarantee a drift on the next rotation.
      - source: mysql_password
        target: db.password
      - source: jwt_secret
        target: jwt.secret
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── UI ─────────────────────────────────────────────────────
  taskflow-ui:
    image: ghcr.io/mehdi-rochereau/taskflow-ui:latest
    container_name: taskflow-ui
    restart: unless-stopped
    depends_on:
      - taskflow-api
    ports:
      - "127.0.0.1:4000:80"
    networks:
      - taskflow-network

# ── Volumes ────────────────────────────────────────────────
volumes:
  taskflow-db-data:
    driver: local

# ── Networks ───────────────────────────────────────────────
networks:
  taskflow-network:
    driver: bridge

# ── Secrets ────────────────────────────────────────────────
# File-based secrets, mounted read-only under /run/secrets/ inside the container.
# The file name there is the secret name in short form, or the `target` value in
# long form, which is how taskflow-api gets db.password and jwt.secret out of
# mysql_password and jwt_secret.
#
# The source files live outside /opt/taskflow: that directory is a Git working
# copy of a public repository, and a stray `git add` there would publish
# production credentials.
#
# Created by hand during installation, mode 600, owner mehdi. They are NOT in
# the repository and NOT in the .env. See README.md.
secrets:
  mysql_root_password:
    file: /home/mehdi/secrets/mysql_root_password
  mysql_password:
    file: /home/mehdi/secrets/mysql_password
  jwt_secret:
    file: /home/mehdi/secrets/jwt_secret

# Server-wide hardening, included into the http block by the
# include /etc/nginx/conf.d/*.conf; line of nginx.conf.
#
# This file exists rather than an edit to nginx.conf for three reasons: it
# covers every server block including the catch-all and the error pages Nginx
# generates itself, it is versioned in this repository where nginx.conf is a
# dpkg conffile that is not, and it survives a package update rewriting
# nginx.conf.
#
# The 10- prefix leaves room below it. Files in conf.d are loaded in
# alphabetical order, which matters only for directives where the last
# declaration wins.
#
# server_tokens off removes the version number from the Server header and from
# the body of Nginx-generated error pages. The header still reads "nginx", the
# directive hides the version, not the product; only the third-party
# headers-more module can remove it entirely, and adding a module to a
# distribution package is a larger decision than this one.
#
# What it buys is modest and worth stating honestly: an attacker who wants the
# version can still infer it from behaviour. What it removes is the case where
# a scanner reads 1.24.0 from the header, matches it against a CVE list and
# targets the server without ever probing it.
#
# nginx.conf ships this directive commented out on line 22. It is left
# commented there rather than uncommented, so that this file is the single
# place the setting lives.
server_tokens off;

# Compression of proxied responses.
#
# gzip on is already set by nginx.conf, but two defaults make it inert on this
# server. gzip_proxied defaults to off, which disables compression for any
# response coming from a proxy_pass, and everything this reverse proxy serves
# comes from one. gzip_types defaults to text/html alone.
#
# gzip_proxied any: compress regardless of what the backend's request headers
# say. The narrower values exist to avoid compressing responses a shared cache
# might serve wrongly; no cache sits between this proxy and its clients.
#
# The type list covers what the API returns. The taskflow-ui container already
# compresses its own responses and Nginx relays them untouched, so the frontend
# gains nothing here; verified with curl on 26 August 2026.
#
# gzip_min_length avoids compressing responses too small to benefit, where the
# gzip header would cost more than the compression saves.
#
# gzip_vary adds Vary: Accept-Encoding, which tells caches that the response
# differs by encoding. Without it a cache can serve a compressed body to a
# client that cannot read it.
#
# Note that compressing a response that carries a secret and is served over TLS
# can leak its length. That is the BREACH class of attacks, and it needs an
# attacker able to inject content into the response, which is not the case
# here.
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/xml
    text/css
    text/plain
    text/xml;
# Reverse proxy headers, included by every location that proxies to a
# container. Without them the backend sees the proxy instead of the client.
#
# Host: the name the client asked for. Nginx would otherwise send the value of
# proxy_pass, so the backend would believe every request targets localhost.
# Spring Boot builds redirect URLs and cookie domains from it, and Let's
# Encrypt-issued links would point at localhost without this line.
#
# $host and not $http_host: $host falls back to the server_name when the
# request carries no Host header, where $http_host would pass an empty value.
#
# X-Real-IP: the address of the client that connected to Nginx. The backend
# sees the proxy's own address at TCP level, so without this line every log
# entry, every rate limit bucket and every audit record would name the server
# itself.
#
# X-Forwarded-For: the chain of proxies, this one appended to whatever the
# client already sent. Kept alongside X-Real-IP because they answer different
# questions: the immediate peer, and the full path. Note that a client can
# forge the incoming part of this header, so it is evidence, not proof.
#
# X-Forwarded-Proto: the scheme the client used. Nginx terminates TLS and
# speaks plain HTTP to the container, so without this line the backend
# believes the connection is insecure. That is exactly why Spring Security
# withholds HSTS, and why that header is set by the proxy instead.
#
# These four headers are trusted by the backend. They must never be accepted
# from the outside, which holds here because the containers are published on
# 127.0.0.1 only and Nginx is the sole entry point.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Let's Encrypt ACME challenge, served over plain HTTP.
#
# Included by the port 80 block of every vhost. Certbot writes the challenge
# file into /var/www/certbot as root, Nginx reads it as www-data.
#
# The ^~ prefix stops the search for regular expression locations as soon as
# this prefix matches. Without it, the redirect to HTTPS in the enclosing
# server block would capture the challenge and the renewal would fail.
#
# root and not alias: Nginx appends the full request URI to the root, so
# /.well-known/acme-challenge/xyz resolves to
# /var/www/certbot/.well-known/acme-challenge/xyz. This is also the layout
# certbot expects when given -w /var/www/certbot.
#
# Only this path is served, never the whole of /var/www/certbot.
#
# Do not move this include below the redirect: location order does not matter
# to Nginx, but a reader who assumes it does will misread the file.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
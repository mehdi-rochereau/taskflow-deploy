# Security headers set by the reverse proxy, included by every port 443 server
# block and by every location that carries an add_header of its own.
#
# HSTS tells the browser to refuse plain HTTP on this host for the given
# duration, before any request is sent. It closes the window a redirect leaves
# open: the first request of a session still travels unencrypted, and can be
# intercepted, until the browser has been told once.
#
# It is set here and not by the application. Spring Security withholds HSTS on
# a request it does not consider secure, and the request reaches it over plain
# HTTP from this proxy. The proxy terminates TLS, so it is the layer that knows
# the connection is encrypted, and it covers both hosts at once.
#
# max-age is one year, the value the specification recommends for a host that
# intends to stay on HTTPS. Shortening it later does not undo it: browsers keep
# the previous value until it expires.
#
# includeSubDomains extends the rule to every subdomain of the host it is
# served from. On api.taskflow.mehdi-rochereau.dev that covers nothing, no
# subdomain exists below it. On taskflow.mehdi-rochereau.dev it covers the API
# host, which is already HTTPS-only, so the directive costs nothing today. It
# would break any future subdomain served over plain HTTP, which is the point.
#
# preload is deliberately absent. It would ask browser vendors to hardcode the
# domain into their binaries, a decision that takes months to reverse and that
# a portfolio project has no reason to make.
#
# always is what makes this header appear on error responses too. Without it
# Nginx sets it on 2xx and 3xx only, so a 404 or a 502 would answer without
# HSTS, which is exactly the response an attacker would try to provoke.
#
# CRITICAL: an add_header in a child block cancels every add_header inherited
# from its parent. Nginx does not warn about this. Any location declaring an
# add_header of its own must include this file again, or it silently loses
# HSTS. The robots.txt location of the API vhost is the case in point.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
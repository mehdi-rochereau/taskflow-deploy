# TLS termination, included by every port 443 server block.
#
# The certificate is a single Let's Encrypt one covering both host names in its
# SAN field, which is why the path names the frontend host on both vhosts and
# on the catch-all. Do not assume a second certificate exists.
#
# ssl_protocols is declared here rather than in conf.d/10-hardening.conf, and
# the reason is not obvious. nginx.conf declares it at http level, and
# conf.d/*.conf is included into that same block. Two declarations in one
# context do not replace one another: the directive is a bit mask and the
# second merges into the first, so a hardening written there would emit
# duplicate value warnings, pass nginx -t, and leave TLSv1 and TLSv1.1
# enabled. Inheritance across contexts behaves normally, a server level
# declaration replacing the http one, which is what this snippet relies on.
#
# Every 443 server block must include this file. One that forgets it inherits
# the http level default and serves TLS 1.0 and 1.1, dead since 2021, without
# any warning.
#
# options-ssl-nginx.conf is maintained by Certbot and carries the Mozilla
# cipher suite, session cache and its own ssl_protocols line. Ours is declared
# after it on purpose: the last declaration in a context wins, so this file
# governs regardless of what Certbot ships in a future version.
#
# ssl_dhparam applies to the DHE cipher suites only. The certificate is ECDSA
# and ECDHE is preferred, so this line is inert in practice; it is kept because
# removing it would silently break any client negotiating a DHE suite.
ssl_certificate /etc/letsencrypt/live/taskflow.mehdi-rochereau.dev/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/taskflow.mehdi-rochereau.dev/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

ssl_protocols TLSv1.2 TLSv1.3;
# TLS termination, included by every port 443 server block.
#
# The certificate is a single Let's Encrypt one covering both host names in its
# SAN field, which is why the path names the frontend host on both vhosts and
# on the catch-all. Do not assume a second certificate exists.
#
# ssl_protocols is deliberately absent from this file, and the reason is worth
# stating so nobody adds it back.
#
# The directive is a bit mask: a second declaration in the same context merges
# into the first rather than replacing it. Declaring it here produced
# duplicate value warnings against the line options-ssl-nginx.conf already
# carries, tested on the VPS on 26 August 2026. Values that disagreed would
# have been unioned, which is how a hardening passes its own check while
# widening what it meant to narrow.
#
# TLS 1.0 and 1.1 are excluded in two places instead. nginx.conf declares
# ssl_protocols TLSv1.2 TLSv1.3 at http level, so a server block that includes
# nothing at all still inherits a safe default; and options-ssl-nginx.conf,
# maintained by Certbot, declares the same pair at server level.
#
# nginx.conf is a dpkg conffile and is not versioned in this repository, so
# that half of the guarantee lives outside Git. Verify it with
# nginx -T | grep ssl_protocols after any Nginx package upgrade: the expected
# output carries TLSv1.2 and TLSv1.3 only.
#
# ssl_dhparam applies to the DHE cipher suites only. The certificate is ECDSA
# and ECDHE is preferred, so this line is inert in practice; it is kept because
# removing it would silently break any client negotiating a DHE suite.
ssl_certificate /etc/letsencrypt/live/taskflow.mehdi-rochereau.dev/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/taskflow.mehdi-rochereau.dev/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;